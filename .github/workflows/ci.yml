name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy mcp_audit tests
      - run: uv run pytest
