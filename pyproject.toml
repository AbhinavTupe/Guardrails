[project]
name = "mcp-audit"
version = "0.1.0"
description = "A CLI for auditing MCP servers and reporting security risks."
readme = "README.md"
authors = [
    { name = "Abhinav Tupe", email = "abhinavtupe1610@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "typer>=0.29.2",
]

[project.scripts]
mcp-audit = "mcp_audit.cli:app"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_audit"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
